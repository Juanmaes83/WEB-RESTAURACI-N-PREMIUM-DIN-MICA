<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>WhatsApp Contact Module LAB</title><link rel="stylesheet" href="styles-v18.css"></head><body><main class="wa-shell" id="wa-lab"><aside class="wa-panel"><h1>WhatsApp Concierge</h1><p>LAB aislado. La integración final será aditiva dentro del Studio actual; no sustituye el panel ni el footer.</p><form id="wa-controls"><section class="wa-group"><h2>Module</h2><label class="wa-check"><input type="checkbox" name="enabled"> Activar módulo</label><div class="wa-row"><label>Modo</label><select name="mode"><option value="floating-launcher">Floating Launcher</option><option value="inline-concierge">Inline Concierge</option><option value="direct-cta">Direct CTA</option></select></div><div class="wa-row"><label>Posición</label><select name="position"><option value="right">Derecha</option><option value="left">Izquierda</option></select></div><label class="wa-check"><input type="checkbox" name="showPrompt"> Mostrar prompt previo</label></section><section class="wa-group"><h2>WhatsApp</h2><div class="wa-row"><label>Número internacional</label><input name="phone" inputmode="tel" placeholder="+34 600 123 456"></div><div class="wa-row"><label>Mensaje inicial</label><textarea name="message"></textarea></div><div class="wa-row"><label>Texto CTA</label><input name="label"></div></section><section class="wa-group"><h2>Concierge copy</h2><div class="wa-row"><label>Eyebrow</label><input name="eyebrow"></div><div class="wa-row"><label>Título</label><input name="title"></div><div class="wa-row"><label>Texto</label><textarea name="body"></textarea></div><div class="wa-row"><label>Disponibilidad</label><input name="availability"></div></section><div class="wa-actions"><button type="button" id="wa-reset">Reset demo</button></div></form></aside><section class="wa-stage"><div id="wa-preview"></div></section></main><script src="class18-whatsapp-contact.js"></script></body></html>
