<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>Social & Reputation Module LAB</title><link rel="stylesheet" href="styles-v17.css"></head><body><main class="sr-shell" id="sr-lab"><aside class="sr-panel"><h1>Social + Reputation</h1><p>LAB aislado. El producto final entra de forma aditiva dentro del Studio actual y hereda su lenguaje visual.</p><form id="sr-controls"><section class="sr-group"><h2>Module</h2><label class="sr-check"><input type="checkbox" name="enabled"> Activar módulo</label><div class="sr-row"><label>Preset</label><select name="preset"><option value="editorial-footer">Editorial Footer</option><option value="reputation-strip">Reputation Strip</option><option value="social-minimal">Social Minimal</option></select></div></section><section class="sr-group"><h2>Contenido</h2><div class="sr-row"><label>Eyebrow</label><input name="eyebrow"></div><div class="sr-row"><label>Título</label><input name="heading"></div><div class="sr-row"><label>Texto</label><textarea name="body"></textarea></div></section><section class="sr-group"><h2>Reputation</h2><label class="sr-check"><input type="checkbox" name="showRating"> Mostrar rating</label><div class="sr-row two"><div><label>Valoración</label><input name="rating" type="number" min="0" max="5" step="0.1"></div><div><label>Nº de reseñas</label><input name="reviewCount" type="number" min="0"></div></div><div class="sr-row"><label>Texto reseñas</label><input name="reviewCtaLabel"></div></section><section class="sr-group"><h2>Platforms</h2><div class="sr-platform-control"><input type="checkbox" name="instagram-enabled"><strong>Instagram</strong><input type="url" name="instagram-url" aria-label="Instagram URL"></div><div class="sr-platform-control"><input type="checkbox" name="tripadvisor-enabled"><strong>Tripadvisor</strong><input type="url" name="tripadvisor-url" aria-label="Tripadvisor URL"></div><div class="sr-platform-control"><input type="checkbox" name="facebook-enabled"><strong>Facebook</strong><input type="url" name="facebook-url" aria-label="Facebook URL"></div><div class="sr-platform-control"><input type="checkbox" name="google-enabled"><strong>Google</strong><input type="url" name="google-url" aria-label="Google Business Profile URL"></div><div class="sr-platform-control"><input type="checkbox" name="thefork-enabled"><strong>TheFork</strong><input type="url" name="thefork-url" aria-label="TheFork URL"></div><div class="sr-platform-control"><input type="checkbox" name="michelin-enabled"><strong>MICHELIN</strong><input type="url" name="michelin-url" aria-label="Michelin Guide URL"></div><div class="sr-platform-control"><input type="checkbox" name="tiktok-enabled"><strong>TikTok</strong><input type="url" name="tiktok-url" aria-label="TikTok URL"></div><div class="sr-platform-control"><input type="checkbox" name="youtube-enabled"><strong>YouTube</strong><input type="url" name="youtube-url" aria-label="YouTube URL"></div></section><div class="sr-actions"><button type="button" id="sr-reset">Reset demo</button></div></form></aside><section class="sr-stage"><div id="sr-preview"></div></section></main><script src="class17-social-reputation.js"></script></body></html>
