<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080807">
  <title>Project 10 — Dish Stage LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles-v13.css">
</head>
<body>
  <main class="ds-lab" data-dish-stage-lab tabindex="0" aria-label="Dish Stage. Arrastra, usa la rueda o las flechas para cambiar de plato.">
    <div class="ds-world ds-world-a" data-ds-world-a aria-hidden="true"></div>
    <div class="ds-world ds-world-b" data-ds-world-b aria-hidden="true"></div>
    <div class="ds-grain" aria-hidden="true"></div>
    <header class="ds-topbar">
      <strong class="ds-brand">LÚMINA</strong>
      <span class="ds-mode">Restaurant Motion Engine · Project 10</span>
      <span class="ds-hint">DRAG · WHEEL · ARROWS</span>
    </header>

    <section class="ds-layout">
      <article class="ds-copy" aria-live="polite">
        <p class="ds-index" data-ds-index></p>
        <p class="ds-meta" data-ds-meta></p>
        <h1 class="ds-title" data-ds-title></h1>
        <p class="ds-short" data-ds-short></p>
        <p class="ds-ingredients" data-ds-ingredients></p>
        <div class="ds-commerce">
          <strong class="ds-price" data-ds-price></strong>
          <button class="ds-explore" data-ds-explore type="button">Explore dish +</button>
        </div>
      </article>

      <div class="ds-stage-wrap">
        <div class="ds-beam" aria-hidden="true"></div>
        <div class="ds-orbit-mark" aria-hidden="true"></div>
        <div class="ds-stage" data-ds-stage></div>
      </div>
    </section>

    <div class="ds-word" data-ds-word aria-hidden="true"></div>
    <nav class="ds-controls" aria-label="Dish navigation">
      <button type="button" data-ds-prev aria-label="Previous dish">←</button>
      <span class="ds-counter" data-ds-counter></span>
      <button type="button" data-ds-next aria-label="Next dish">→</button>
    </nav>
    <div class="ds-live" data-ds-live aria-live="polite"></div>

    <div class="ds-detail" data-ds-detail aria-hidden="true" role="dialog" aria-modal="true" aria-label="Dish detail">
      <div class="ds-detail-card">
        <button class="ds-detail-close" data-ds-detail-close type="button" aria-label="Close dish detail">×</button>
        <div class="ds-detail-media-wrap"><img class="ds-detail-media" data-detail-media alt=""></div>
        <div>
          <p class="ds-detail-meta" data-detail-meta></p>
          <h2 class="ds-detail-title" data-detail-title></h2>
          <div class="ds-detail-price" data-detail-price></div>
          <p class="ds-detail-description" data-detail-description></p>
          <div class="ds-detail-grid">
            <div><span>Ingredients</span><p data-detail-ingredients></p></div>
            <div><span>Origin</span><p data-detail-origin></p></div>
            <div><span>Technique</span><p data-detail-technique></p></div>
            <div><span>Pairing</span><p data-detail-pairing></p></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="../../class4-config.js"></script>
  <script src="../../class13-dish-stage.js"></script>
</body>
</html>
