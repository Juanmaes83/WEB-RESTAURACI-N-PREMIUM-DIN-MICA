<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Class 24 · Beverage Experience · Visual Review</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080807;font-family:Arial,sans-serif}.review-frame{border:0;width:100%;height:100%;display:block}.review-bar{position:fixed;z-index:9999;top:12px;right:12px;display:flex;gap:8px;align-items:center;padding:8px 10px;background:rgba(8,8,7,.78);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(14px);color:white;box-shadow:0 10px 40px rgba(0,0,0,.22)}.review-bar strong{font-size:11px;letter-spacing:.08em;margin:0 6px}.review-bar button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:white;border-radius:999px;padding:8px 12px;font-size:11px;cursor:pointer}.review-bar button:hover{background:rgba(255,255,255,.16)}.review-status{font-size:10px;opacity:.68}@media(max-width:650px){.review-bar{left:8px;right:8px;top:8px;justify-content:center;flex-wrap:wrap;border-radius:18px}.review-bar strong{width:100%;text-align:center}.review-status{display:none}}
  </style>
</head>
<body>
  <div class="review-bar" role="toolbar" aria-label="Controles de revisión Class 24">
    <strong>CLASS 24 · BEVERAGE</strong><span class="review-status" id="status">Cargando integración…</span>
    <button id="section" type="button">Ver bebidas</button><button id="studio" type="button">Studio · Bebidas</button><button id="reload" type="button">Recargar</button>
  </div>
  <iframe class="review-frame" id="frame" src="index.html?beverage-review=1" title="Restaurant Premium con Beverage Experience"></iframe>
  <script>
    const frame=document.getElementById('frame'),status=document.getElementById('status');
    const loadScript=(doc,src)=>new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;doc.body.appendChild(s)});
    const loadCss=(doc,href)=>{const l=doc.createElement('link');l.rel='stylesheet';l.href=href;doc.head.appendChild(l)};
    async function inject(){
      const w=frame.contentWindow,d=frame.contentDocument;status.textContent='Integrando…';
      loadCss(d,'styles-v24.css');
      const scripts=['restaurant-media.js','restaurant-media-picker.js','class24-beverages-model.js','class24-beverages-review.js','class24-beverages-engine.js','class24-beverages-studio.js'];
      for(const src of scripts) await loadScript(d,src);
      w.RestaurantBeveragesModel?.seed?.();await w.RestaurantBeveragesEngine?.refresh?.();
      status.textContent='READY · Project State + Studio + Media + Engine';
    }
    frame.addEventListener('load',()=>inject().catch(err=>{console.error(err);status.textContent='ERROR · revisar consola'}));
    document.getElementById('section').onclick=()=>frame.contentDocument?.querySelector('#beverages')?.scrollIntoView({behavior:'smooth'});
    document.getElementById('studio').onclick=()=>{const w=frame.contentWindow;w.RestaurantStudioShell?.open?.();setTimeout(()=>w.RestaurantBeveragesStudio?.open?.(),100)};
    document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();
  </script>
</body>
</html>
