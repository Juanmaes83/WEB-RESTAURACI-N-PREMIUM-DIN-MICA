name: SEO GEO Foundation
on:
  pull_request:
  workflow_dispatch:
jobs:
  seo-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --test tests/seo-geo-core.test.cjs tests/seo-geo-publisher.test.cjs tests/seo-geo-source-convergence.test.cjs tests/seo-geo-spain-first-contract.test.cjs tests/seo-geo-encoding-gate.test.cjs tests/seo-geo-media-b1.test.cjs tests/seo-geo-release-b.test.cjs
          node --check rubik-seo-geo-core.js
          node --check rubik-seo-geo-publisher.js
          node --check rubik-seo-geo-media.js
          node --check rubik-seo-geo-release-b.js
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - run: node tests/seo-geo-studio-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-geo-foundation
          path: output/playwright/seo-geo/
          retention-days: 14
