name: Studio Real Preview C1
on:
  pull_request:
  workflow_dispatch:
jobs:
  studio-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real viewport / Project State / overlays gate
        run: node tests/studio-real-preview-e2e.mjs
