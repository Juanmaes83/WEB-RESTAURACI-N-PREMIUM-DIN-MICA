name: Class 07 Dish Journey

on:
  push:
    branches: [class7-dish-journey]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  class7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax validation
        run: |
          node --check class7-dish-journey.js
          node --check class6-detail-bridge.js
          node --check tests/class7-dish-journey-e2e.mjs
      - name: Install browser test runtime
        run: |
          test -f package.json || npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Class 07 Dish Journey E2E
        run: |
          python3 -m http.server 4173 >/tmp/class7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/class7-dish-journey-e2e.mjs
