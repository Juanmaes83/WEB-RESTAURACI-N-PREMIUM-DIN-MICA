name: Apply Motion 15 Integration

on:
  push:
    branches:
      - feat/three-native-product-engines

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-native-product-engines
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply additive integration patches
        run: python scripts/apply-native-product-engines.py
      - name: Guard expected Motion 15 contract
        run: |
          grep -q "id:'circular-product',kind:'preset'" class19-motion-library.js
          grep -q "id:'dish-stage-product',kind:'preset'" class19-motion-library.js
          grep -q "id:'cinematic-rail-product',kind:'preset'" class19-motion-library.js
          grep -q "native-product-engines.js" class4-runtime-guard.js
          grep -q "value=\"circular-product\"" class5-studio-motion.js
          node --check native-product-engines.js
          node --check class19-motion-library.js
          node --check class4-runtime-guard.js
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(motion): integrate three native Product Engines"
          git push origin HEAD:feat/three-native-product-engines
