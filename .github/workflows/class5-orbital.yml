name: Class 05 orbital choreography

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  orbital:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check class5-urban-harmony.js
      - name: Install browser test runtime
        run: |
          test -f package.json || npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Class 05 orbital E2E
        run: |
          python3 -m http.server 4173 >/tmp/class5-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/class5-orbital-e2e.mjs
